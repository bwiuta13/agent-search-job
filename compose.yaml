services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_UID: "${APP_UID:-10001}"
        APP_GID: "${APP_GID:-10001}"
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${PORT:-8765}:8765"
    environment:
      ALLOWLIST_EMAILS: "${ALLOWLIST_EMAILS-friend@example.com}"
      # Tài khoản đăng nhập cố định: đặt LOGIN_EMAIL + LOGIN_CODE (>= 12 ký tự) trong .env trên server, không ghi vào repo.
      # Bỏ trống -> email trong ALLOWLIST_EMAILS dùng mã ngẫu nhiên (xem bằng scripts/show_token.py).
      LOGIN_EMAIL: "${LOGIN_EMAIL-}"
      LOGIN_CODE: "${LOGIN_CODE-}"
      JOBS_DB: data/jobs.db
      # Nginx/Caddy trên máy chủ gọi vào container qua IP bridge của Docker, không phải 127.0.0.1 -> uvicorn mặc định
      # bỏ qua X-Forwarded-Proto và cookie đăng nhập / cookie khách của Trợ lý AI không có cờ Secure dù chạy https.
      # Tin mọi IP là an toàn vì cổng chỉ mở ở 127.0.0.1 (ports bên trên).
      FORWARDED_ALLOW_IPS: "${FORWARDED_ALLOW_IPS-*}"
      AI_PROVIDER: "${AI_PROVIDER-openai}"
      AI_TEXT_MODEL: "${AI_TEXT_MODEL-z-ai/glm-5.3}"
      OPENAI_API_KEY: "${OPENAI_API_KEY-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL-https://tokenplan.api.greennode.ai/v1}"
      OPENAI_REQUEST_TIMEOUT_SECONDS: "${OPENAI_REQUEST_TIMEOUT_SECONDS-90}"
      ASSISTANT_CHAT_TTL_HOURS: "${ASSISTANT_CHAT_TTL_HOURS-24}"
      ASSISTANT_DAILY_MESSAGES: "${ASSISTANT_DAILY_MESSAGES-100}"
      ASSISTANT_DAILY_WEB_SEARCHES: "${ASSISTANT_DAILY_WEB_SEARCHES-20}"
      ASSISTANT_GUEST_DAILY_MESSAGES: "${ASSISTANT_GUEST_DAILY_MESSAGES-300}"
      ASSISTANT_GUEST_DAILY_WEB_SEARCHES: "${ASSISTANT_GUEST_DAILY_WEB_SEARCHES-30}"
      JOB_STALE_DAYS: "${JOB_STALE_DAYS-30}"
      JOB_PURGE_AFTER_DAYS: "${JOB_PURGE_AFTER_DAYS-90}"
      CRAWL_RUNS_KEEP_DAYS: "${CRAWL_RUNS_KEEP_DAYS-90}"
      # Quét định kỳ (mặc định 12h): quét nguồn -> xoá job hết hạn/không còn tuyển -> mail job mới
      SCHEDULED_SCAN_ENABLED: "${SCHEDULED_SCAN_ENABLED-1}"
      # quét + gửi mail đúng 8h sáng và 8h tối giờ Việt Nam; bỏ trống SCAN_TIMES -> mỗi SCAN_INTERVAL_HOURS giờ
      SCAN_TIMES: "${SCAN_TIMES-08:00,20:00}"
      SCAN_INTERVAL_HOURS: "${SCAN_INTERVAL_HOURS-12}"
      SCAN_ON_STARTUP: "${SCAN_ON_STARTUP-0}"
      SCAN_DELETE_AFTER_DAYS: "${SCAN_DELETE_AFTER_DAYS-3}"
      # xoá hẳn job quá hạn nộp mỗi N giờ (0 = tắt)
      EXPIRED_PURGE_HOURS: "${EXPIRED_PURGE_HOURS-6}"
      SCAN_JD_DETAILS: "${SCAN_JD_DETAILS-1}"
      SCAN_LINKEDIN: "${SCAN_LINKEDIN-1}"
      SITE_URL: "${SITE_URL-}"
      # Mail thông báo job mới (SMTP_HOST + MAIL_TO trống -> không gửi mail)
      SMTP_HOST: "${SMTP_HOST-}"
      SMTP_PORT: "${SMTP_PORT-587}"
      SMTP_SSL: "${SMTP_SSL-0}"
      SMTP_USER: "${SMTP_USER-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD-}"
      MAIL_FROM: "${MAIL_FROM-}"
      MAIL_TO: "${MAIL_TO-}"
      NEW_JOB_MAIL_MAX: "${NEW_JOB_MAIL_MAX-30}"
      SMTP_TIMEOUT_SECONDS: "${SMTP_TIMEOUT_SECONDS-30}"
    volumes:
      - "${DATA_DIR:-./data}:/app/data"
      - "${BACKUP_DIR:-./backups}:/app/backups"
    shm_size: 512mb
    security_opt:
      - no-new-privileges:true
